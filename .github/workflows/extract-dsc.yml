name: extract-dsc

on:
  workflow_dispatch:
    inputs:
      ota_url:
        description: 'OTA URL'
        required: true
        default: 'https://updates.cdn-apple.com/2025FallFCS/mobileassets/082-75475/8B9D9F04-0315-486B-B6D7-74CBDE6B69F7/com_apple_MobileAsset_SoftwareUpdate/d3096ea61ca4ede122ea1319fc34fa4578fbfee23ce0434be8b23e815f96453a.aea'
      aea_key:
        description: 'AEA decryption key (base64)'
        required: true
        default: 'G4nXofLNVZ2UcF3Iz6yS6JVi0Hr6yfisNC0QfYD+dHY='
      arch:
        description: 'dyld arch'
        required: true
        default: 'arm64e'
      tag:
        description: 'Caller correlation tag (echoed to logs and ft_tag.txt)'
        required: false
        default: ''
      ota_form:
        description: 'OTA payload form: aea (keyed personalized, default) or zip (old-generation patches/*.zip)'
        required: false
        default: 'aea'

jobs:
  extract:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Environment info
        run: |
          echo "=== CPU ==="; sysctl -n hw.ncpu
          echo "=== RAM ==="; sysctl -n hw.memsize | awk '{print $1/1024/1024/1024 " GB"}'
          echo "=== Disk ==="; df -h /
          echo "=== macOS ==="; sw_vers
          echo "=== Work dir ==="; echo "$RUNNER_TEMP"; df -h "$RUNNER_TEMP"
          echo "FT_TAG=${{ inputs.tag }}"

      - name: Install ipsw
        run: |
          for i in 1 2 3 4; do
            if brew install blacktop/tap/ipsw; then
              ipsw version
              exit 0
            fi
            echo "brew install attempt $i failed; retrying after 15s"
            sleep 15
          done
          echo "brew install failed after 4 attempts"
          exit 1

      - name: Download OTA (parallel ranged)
        run: |
          cd "$RUNNER_TEMP"
          URL="${{ inputs.ota_url }}"
          EXT="aea"
          if [ "${{ inputs.ota_form }}" = "zip" ]; then EXT="zip"; fi
          echo "OTA_FORM=${{ inputs.ota_form }} EXT=$EXT"
          echo "Starting download: $URL"
          SIZE=$(curl -sIL --retry 5 --retry-delay 5 --connect-timeout 30 "$URL" | grep -i '^content-length' | tail -1 | tr -d '\r' | awk '{print $2}')
          echo "content-length=$SIZE"
          N=8
          ok=1
          if [ -n "$SIZE" ] && [ "$SIZE" -gt 200000000 ]; then
            CHUNK=$(( (SIZE + N - 1) / N ))
            for i in $(seq 0 $((N-1))); do
              S=$(( i * CHUNK )); E=$(( S + CHUNK - 1 )); [ "$E" -ge "$SIZE" ] && E=$(( SIZE - 1 ))
              curl -sfL --retry 5 --retry-delay 10 --connect-timeout 30 -r "$S-$E" -o "part_$i" "$URL" &
            done
            wait
            # verify + repair pass
            for i in $(seq 0 $((N-1))); do
              S=$(( i * CHUNK )); E=$(( S + CHUNK - 1 )); [ "$E" -ge "$SIZE" ] && E=$(( SIZE - 1 ))
              EXP=$(( E - S + 1 ))
              ACT=$(stat -f%z "part_$i" 2>/dev/null || echo 0)
              if [ "$ACT" != "$EXP" ]; then
                echo "repair part_$i ($ACT != $EXP)"
                curl -sfL --retry 5 --retry-delay 10 --connect-timeout 30 -r "$S-$E" -o "part_$i" "$URL"
                ACT=$(stat -f%z "part_$i" 2>/dev/null || echo 0)
                [ "$ACT" = "$EXP" ] || { echo "part_$i unrecoverable"; ok=0; }
              fi
            done
            if [ "$ok" = "1" ]; then
              cat part_* > ota.$EXT
              rm -f part_*
              ACT=$(stat -f%z ota.$EXT)
              echo "assembled size=$ACT expected=$SIZE"
              [ "$ACT" = "$SIZE" ] && exit 0
            fi
            echo "parallel path failed — clean single-stream fallback"
            rm -f part_* ota.aea ota.zip
          fi
          curl -L --retry 5 --retry-delay 10 --connect-timeout 30 -C - -o ota.$EXT "$URL"
          ls -la ota.$EXT
          echo "=== Disk after download ==="; df -h /

      - name: Verify AEA header
        if: inputs.ota_form != 'zip'
        run: |
          cd "$RUNNER_TEMP"
          xxd -l 64 ota.aea
      - name: Verify zip payload and enumerate members
        if: inputs.ota_form == 'zip'
        run: |
          cd "$RUNNER_TEMP"
          echo "=== zip magic (expect PK) ==="
          xxd -l 16 ota.zip
          M=$(xxd -p -l 2 ota.zip)
          [ "$M" = "504b" ] && echo "ZIP_MAGIC_OK" || { echo "ZIP_MAGIC_UNEXPECTED=$M"; exit 1; }
          echo "=== zip inventory (head 80) ==="
          unzip -l ota.zip | head -80
          echo "=== cryptex/system/dmg members ==="
          unzip -l ota.zip | grep -i 'cryptex\|system\|\.dmg' | head -40 || echo "no cryptex/system/dmg named members"
          echo "=== all members count ==="
          unzip -l ota.zip | tail -1


      - name: Extract dyld_shared_cache
        if: inputs.ota_form != 'zip'
        run: |
          cd "$RUNNER_TEMP"
          mkdir -p out
          echo "=== Disk before extract ==="; df -h /
          set +e
          ipsw ota extract ota.aea --dyld --dyld-arch "${{ inputs.arch }}" \
            --confirm --key-val "${{ inputs.aea_key }}" \
            --output ./out --json > extract.json 2> extract.err
          RC=$?
          echo "RC=$RC"
          echo "=== stderr tail ==="; tail -30 extract.err
          echo "=== json head ==="; head -c 2000 extract.json
          echo
          echo "=== Disk after extract ==="; df -h /
          echo "=== out ==="; find ./out -type f | head -30
          du -sh ./out 2>/dev/null
          exit 0

      - name: Extract dyld_shared_cache (zip form probe)
        if: inputs.ota_form == 'zip'
        run: |
          cd "$RUNNER_TEMP"
          mkdir -p out
          echo "=== Disk before zip extract ==="; df -h /
          echo "=== trial A: ipsw ota extract direct on zip (no key) ==="
          set +e
          ipsw ota extract ota.zip --dyld --dyld-arch "${{ inputs.arch }}" --confirm --output ./out --json > extract.json 2> extract.err
          RC_A=$?
          echo "RC_A=$RC_A"
          echo "--- stderr tail A ---"; tail -30 extract.err
          echo "--- json head A ---"; head -c 2000 extract.json; echo
          if [ "$RC_A" != "0" ] || [ -z "$(find ./out -type f | head -1)" ]; then
            echo "=== trial B: unzip + cryptex member chain ==="
            mkdir -p unz
            unzip -q ota.zip -d unz
            echo "--- unz dirs (maxdepth 4) ---"; find unz -maxdepth 4 -type d | head -40
            echo "--- big file candidates ---"
            find unz -type f -size +50M | head -20
            echo "--- candidate magic bytes (16B each, top 5) ---"
            for f in $(find unz -type f -size +50M | head -5); do
              echo "--- $f ($(stat -f%z "$f") bytes)"; xxd -l 16 "$f"
            done
            CRYPT=$(find unz -type f -iname '*cryptex*system*' | head -1)
            [ -z "$CRYPT" ] && CRYPT=$(find unz -type f -name '*.dmg' -size +100M | head -1)
            echo "CRYPT=$CRYPT"
            if [ -n "$CRYPT" ]; then
              echo "--- payload metadata plist (if any) ---"
              find unz -name 'metadata*' -o -name '*.plist' | head -10
              for p in $(find unz -name 'metadata*' | head -2); do
                echo "--- $p head ---"; head -c 1500 "$p"; echo
                plutil -p "$p" 2>/dev/null | grep -iA2 'base\|cryptex' | head -40 || true
              done
              echo "--- ipsw ota patch rsr --cryptex trial ---"
              ipsw ota patch rsr --cryptex "$CRYPT" --output ./out --json > extract.json 2> extract.err
              RC_B=$?
              echo "RC_B=$RC_B"
              tail -30 extract.err
              head -c 2000 extract.json; echo
            else
              echo "NO cryptex/system dmg candidate found in zip"
              echo "ZIP_FORM_PROBE:no_cryptex_candidate"
            fi
          fi
          echo "=== out tree ==="; find ./out -type f | head -30
          du -sh ./out 2>/dev/null
          echo "=== Disk after zip extract ==="; df -h /
          exit 0

      - name: Collect results
        run: |
          cd "$RUNNER_TEMP"
          mkdir -p upload
          cp extract.json upload/ 2>/dev/null || true
          cp extract.err upload/ 2>/dev/null || true
          printf '%s' "${{ inputs.tag }}" > upload/ft_tag.txt
          ( cd ./out && find . -type f -size -100M -print0 | tar --null -T - -czf "$RUNNER_TEMP/upload/small-files.tar.gz" )
          echo "=== upload dir ==="; ls -la upload/ | head -20
          du -sh upload

      - name: Delete OTA to free space
        run: |
          cd "$RUNNER_TEMP"
          rm -f ota.aea ota.zip
          rm -rf unz
          echo "=== Disk after cleanup ==="; df -h /

      - name: Upload small artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsc-result-json
          path: ${{ runner.temp }}/upload/
          retention-days: 7
          if-no-files-found: warn

      - name: Split and upload dsc
        run: |
          cd "$RUNNER_TEMP"
          mkdir -p parts
          find ./out -type f -size +100M | while read -r f; do
            echo "splitting $f"
            split -b 900m "$f" "parts/$(basename "$f")." 2>/dev/null || true
          done
          ls -la parts/ | head -20
          du -sh parts

      - name: Upload dsc parts
        uses: actions/upload-artifact@v4
        with:
          name: dsc-parts
          path: ${{ runner.temp }}/parts/
          retention-days: 7
          if-no-files-found: warn
